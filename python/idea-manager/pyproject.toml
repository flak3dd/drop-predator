[project]
name = "drop-predator-idea-manager"
version = "0.1.0"
description = "Terminal-based idea conceptualisation and manifestation tool for Drop Predator"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "requests>=2.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
]

[project.scripts]
idea = "idea_manager:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
