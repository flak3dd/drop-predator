<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Predator — Sentiment &amp; Hype Crawl</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0e17;color:#c8d6e5;font-family:'SF Mono',Menlo,Monaco,monospace;font-size:13px;overflow-x:hidden}
  .header{background:linear-gradient(135deg,#0f1923 0%,#1a1a2e 100%);border-bottom:1px solid #1e90ff33;padding:20px 28px;display:flex;align-items:center;gap:16px}
  .header h1{font-size:18px;color:#1e90ff;font-weight:700;letter-spacing:1px}
  .header .tag{background:#1e90ff22;color:#1e90ff;padding:3px 10px;border-radius:10px;font-size:11px;border:1px solid #1e90ff44}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:calc(100vh - 68px)}
  .panel{border-right:1px solid #1e90ff15;border-bottom:1px solid #1e90ff15;padding:18px 22px;position:relative;overflow:hidden}
  .panel-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#1e90ff99;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel-title .dot{width:6px;height:6px;border-radius:50%;background:#1e90ff;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:#0d1520;border:1px solid #1e90ff22;border-radius:8px;padding:12px 16px;flex:1;min-width:100px}
  .stat .val{font-size:26px;font-weight:700;color:#fff;line-height:1.2}
  .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#546e7a;margin-top:2px}
  .stat.pos .val{color:#00e676}
  .stat.neg .val{color:#ff5252}
  .stat.neu .val{color:#ffd740}
  .stat.hype .val{color:#e040fb}
  .feed{max-height:320px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1e90ff33 transparent}
  .feed::-webkit-scrollbar{width:4px}
  .feed::-webkit-scrollbar-thumb{background:#1e90ff33;border-radius:4px}
  .feed-item{padding:8px 12px;border-left:2px solid #1e90ff33;margin-bottom:6px;background:#0d152088;border-radius:0 6px 6px 0;animation:fadeIn .3s ease}
  .feed-item.positive{border-left-color:#00e676}
  .feed-item.negative{border-left-color:#ff5252}
  .feed-item.neutral{border-left-color:#ffd740}
  .feed-item .src{font-size:10px;color:#546e7a;margin-bottom:2px}
  .feed-item .txt{font-size:12px;color:#dee}
  .feed-item .sentiment-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:6px;font-weight:600}
  .feed-item .sentiment-tag.pos{background:#00e67622;color:#00e676}
  .feed-item .sentiment-tag.neg{background:#ff525222;color:#ff5252}
  .feed-item .sentiment-tag.neu{background:#ffd74022;color:#ffd740}
  @keyframes fadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  .bar-chart{display:flex;flex-direction:column;gap:6px}
  .bar-row{display:flex;align-items:center;gap:8px}
  .bar-label{width:90px;font-size:11px;color:#8899aa;text-align:right;flex-shrink:0}
  .bar-track{flex:1;height:18px;background:#0d1520;border-radius:4px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:4px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:9px;font-weight:700;color:#fff}
  .bar-fill.pos{background:linear-gradient(90deg,#00e67644,#00e676)}
  .bar-fill.neg{background:linear-gradient(90deg,#ff525244,#ff5252)}
  .bar-fill.neu{background:linear-gradient(90deg,#ffd74044,#ffd740)}
  .bar-fill.hype{background:linear-gradient(90deg,#e040fb44,#e040fb)}
  .hype-meter{text-align:center;padding:10px 0}
  .hype-score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#e040fb,#1e90ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
  .hype-label{font-size:12px;color:#8899aa;margin-top:4px}
  .hype-breakdown{margin-top:16px}
  .scanner{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#1e90ff,transparent);animation:scan 2s linear infinite;opacity:.6}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .status-bar{background:#070b12;border-top:1px solid #1e90ff22;padding:8px 22px;font-size:11px;color:#546e7a;display:flex;justify-content:space-between;grid-column:1/-1}
  .status-bar .active{color:#1e90ff}
  .source-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .source-chip{background:#0d1520;border:1px solid #1e90ff22;border-radius:12px;padding:3px 10px;font-size:10px;color:#8899aa}
  .source-chip.done{border-color:#00e67644;color:#00e676}
  .source-chip.scanning{border-color:#1e90ff;color:#1e90ff;animation:pulse 1s infinite}
  .source-chip.queued{opacity:.4}
  .keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .kw{background:#1e90ff11;border:1px solid #1e90ff22;border-radius:6px;padding:4px 10px;font-size:11px}
  .kw .count{color:#1e90ff;font-weight:700;margin-left:4px}
</style>
</head>
<body>
  <div class="header">
    <h1>DROP PREDATOR</h1>
    <span class="tag" id="statusTag">INITIALIZING</span>
    <span style="flex:1"></span>
    <span style="font-size:11px;color:#546e7a" id="clock"></span>
  </div>

  <div class="grid">
    <!-- Panel 1: Live Feed -->
    <div class="panel" style="grid-row:span 2">
      <div class="scanner"></div>
      <div class="panel-title"><span class="dot"></span> LIVE CRAWL FEED</div>
      <div class="feed" id="feed"></div>
    </div>

    <!-- Panel 2: Sentiment Stats -->
    <div class="panel">
      <div class="panel-title"><span class="dot"></span> SENTIMENT ANALYSIS</div>
      <div class="stats-row">
        <div class="stat pos"><div class="val" id="posCount">0</div><div class="lbl">Positive</div></div>
        <div class="stat neg"><div class="val" id="negCount">0</div><div class="lbl">Negative</div></div>
        <div class="stat neu"><div class="val" id="neuCount">0</div><div class="lbl">Neutral</div></div>
      </div>
      <div class="bar-chart" id="sentimentBars">
        <div class="bar-row"><span class="bar-label">Positive</span><div class="bar-track"><div class="bar-fill pos" id="posBar" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">Negative</span><div class="bar-track"><div class="bar-fill neg" id="negBar" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">Neutral</span><div class="bar-track"><div class="bar-fill neu" id="neuBar" style="width:0%"></div></div></div>
      </div>
    </div>

    <!-- Panel 3: Hype Meter -->
    <div class="panel">
      <div class="panel-title"><span class="dot"></span> HYPE METER</div>
      <div class="hype-meter">
        <div class="hype-score" id="hypeScore">0</div>
        <div class="hype-label">/ 100 HYPE INDEX</div>
      </div>
      <div class="hype-breakdown bar-chart" id="hypeBars">
        <div class="bar-row"><span class="bar-label">Buzz</span><div class="bar-track"><div class="bar-fill hype" id="buzzBar" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">Urgency</span><div class="bar-track"><div class="bar-fill hype" id="urgencyBar" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">Exclusivity</span><div class="bar-track"><div class="bar-fill hype" id="exclBar" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">FOMO</span><div class="bar-track"><div class="bar-fill hype" id="fomoBar" style="width:0%"></div></div></div>
      </div>
    </div>

    <!-- Panel 4: Sources & Keywords -->
    <div class="panel" style="grid-column:1/-1">
      <div class="panel-title"><span class="dot"></span> SCAN TARGETS</div>
      <div class="source-list" id="sources"></div>
      <div class="panel-title" style="margin-top:16px"><span class="dot"></span> TRENDING KEYWORDS</div>
      <div class="keywords" id="keywords"></div>
    </div>

    <div class="status-bar">
      <span id="statusText">Initializing crawl engine...</span>
      <span class="active" id="scannedCount">0 sources scanned</span>
    </div>
  </div>

<script>
  setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString()},1000);
  document.getElementById('clock').textContent=new Date().toLocaleTimeString();

  window.crawlData = {
    positive: 0, negative: 0, neutral: 0,
    total: 0,
    hype: { buzz: 0, urgency: 0, exclusivity: 0, fomo: 0 },
    keywords: {},
    scanned: 0
  };

  window.addFeedItem = function(source, text, sentiment) {
    const d = window.crawlData;
    d.total++;
    if (sentiment === 'positive') d.positive++;
    else if (sentiment === 'negative') d.negative++;
    else d.neutral++;

    document.getElementById('posCount').textContent = d.positive;
    document.getElementById('negCount').textContent = d.negative;
    document.getElementById('neuCount').textContent = d.neutral;

    const pct = d.total > 0 ? 100 : 0;
    document.getElementById('posBar').style.width = (d.positive/d.total*100).toFixed(1)+'%';
    document.getElementById('posBar').textContent = d.positive > 0 ? Math.round(d.positive/d.total*100)+'%' : '';
    document.getElementById('negBar').style.width = (d.negative/d.total*100).toFixed(1)+'%';
    document.getElementById('negBar').textContent = d.negative > 0 ? Math.round(d.negative/d.total*100)+'%' : '';
    document.getElementById('neuBar').style.width = (d.neutral/d.total*100).toFixed(1)+'%';
    document.getElementById('neuBar').textContent = d.neutral > 0 ? Math.round(d.neutral/d.total*100)+'%' : '';

    const cls = sentiment === 'positive' ? 'positive' : sentiment === 'negative' ? 'negative' : 'neutral';
    const tagCls = sentiment === 'positive' ? 'pos' : sentiment === 'negative' ? 'neg' : 'neu';
    const el = document.createElement('div');
    el.className = 'feed-item ' + cls;
    el.innerHTML = '<div class="src">' + source + '</div><div class="txt">' + text + ' <span class="sentiment-tag ' + tagCls + '">' + sentiment.toUpperCase() + '</span></div>';
    const feed = document.getElementById('feed');
    feed.prepend(el);
    if (feed.children.length > 50) feed.removeChild(feed.lastChild);
  };

  window.updateHype = function(buzz, urgency, exclusivity, fomo) {
    const d = window.crawlData.hype;
    d.buzz = buzz; d.urgency = urgency; d.exclusivity = exclusivity; d.fomo = fomo;
    const score = Math.round((buzz + urgency + exclusivity + fomo) / 4);
    document.getElementById('hypeScore').textContent = score;
    document.getElementById('buzzBar').style.width = buzz + '%';
    document.getElementById('buzzBar').textContent = buzz;
    document.getElementById('urgencyBar').style.width = urgency + '%';
    document.getElementById('urgencyBar').textContent = urgency;
    document.getElementById('exclBar').style.width = exclusivity + '%';
    document.getElementById('exclBar').textContent = exclusivity;
    document.getElementById('fomoBar').style.width = fomo + '%';
    document.getElementById('fomoBar').textContent = fomo;
  };

  window.setSourceStatus = function(name, status) {
    let el = document.getElementById('src-' + name.replace(/[^a-zA-Z0-9]/g, ''));
    if (!el) {
      el = document.createElement('span');
      el.id = 'src-' + name.replace(/[^a-zA-Z0-9]/g, '');
      el.className = 'source-chip queued';
      el.textContent = name;
      document.getElementById('sources').appendChild(el);
    }
    el.className = 'source-chip ' + status;
    if (status === 'done') {
      window.crawlData.scanned++;
      document.getElementById('scannedCount').textContent = window.crawlData.scanned + ' sources scanned';
    }
  };

  window.addKeyword = function(word, count) {
    window.crawlData.keywords[word] = (window.crawlData.keywords[word] || 0) + count;
    const container = document.getElementById('keywords');
    let el = document.getElementById('kw-' + word.replace(/[^a-zA-Z0-9]/g, ''));
    if (!el) {
      el = document.createElement('span');
      el.id = 'kw-' + word.replace(/[^a-zA-Z0-9]/g, '');
      el.className = 'kw';
      container.appendChild(el);
    }
    el.innerHTML = word + '<span class="count">x' + window.crawlData.keywords[word] + '</span>';
  };

  window.setStatus = function(text) {
    document.getElementById('statusText').textContent = text;
  };

  window.setTag = function(text) {
    document.getElementById('statusTag').textContent = text;
  };
</script>
</body>
</html>
